name: Build & Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Terminus.slnx

      - name: Build
        run: dotnet build Terminus.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Terminus.slnx --configuration Release --no-build
